name: Yours Mart verification

on:
  push:
    branches:
      - feat/marketplace-transformation
  pull_request:
    branches:
      - feat/tryon-local-readiness
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run isolated marketplace smoke verification
        run: python verify_app.py
      - name: Run virtual try-on adapter tests
        run: python -m unittest discover -s tests -v
