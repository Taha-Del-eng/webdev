name: Yours Mart CI
on:
  push:
    branches: ["main","feature/yours-mart-ai-marketplace"]
  pull_request:
    branches: ["main"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m py_compile app.py app/main.py app/services/ai_tryon.py app/services/recommendations.py app/services/storage.py
      - run: python verify_app.py
