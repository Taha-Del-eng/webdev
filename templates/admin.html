<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yours Mart | Admin</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --bg-deep: #e7edf7;
      --navy: #10213d;
      --panel: #ffffff;
      --panel-soft: #edf3ff;
      --line: #dfe7f5;
      --primary: #1d4ed8;
      --primary-dark: #163ea7;
      --text: #122033;
      --muted: #62718d;
      --danger: #d93b3b;
      --shadow: 0 18px 40px rgba(16, 33, 61, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, var(--bg), var(--bg-deep));
      color: var(--text);
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 5vw; background: rgba(255,255,255,0.88); border-bottom: 1px solid var(--line);
      box-shadow: 0 2px 10px rgba(16,33,61,0.04);
    }
    .brand { font-size: 1.8rem; font-weight: 800; color: var(--navy); }
    .nav-btn {
      background: var(--primary); border: none; color: white;
      border-radius: 10px; padding: 10px 16px; font-weight: 700;
      box-shadow: var(--shadow);
    }
    main { padding: 30px 5vw 60px; }
    .panel {
      background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
      padding: 22px; margin-bottom: 24px; box-shadow: var(--shadow);
    }
    .panel h2 { margin-top: 0; font-size: 1.7rem; }
    .form-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px;
    }
    .form-grid input, .form-grid select {
      width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line);
      background: var(--panel-soft); color: var(--text);
    }
    .submit-btn {
      background: var(--primary); color: white; border: none; cursor: pointer; border-radius: 10px;
      padding: 12px 18px; font-weight: 700;
    }
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%; border-collapse: collapse; margin-top: 12px;
    }
    th, td {
      border-bottom: 1px solid var(--line); text-align: left; padding: 12px 10px;
      vertical-align: top;
    }
    th { color: var(--muted); font-weight: 700; }
    .inline-form {
      display: flex; flex-direction: column; gap: 8px; min-width: 210px;
    }
    .inline-form input {
      width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
      background: var(--panel-soft); color: var(--text);
    }
    .delete-btn, .update-btn {
      border: none; border-radius: 8px; padding: 8px 10px; font-weight: 700; cursor: pointer;
    }
    .update-btn { background: var(--primary); color: white; }
    .delete-btn { background: var(--danger); color: white; }
    .category-editor {
      display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin-top: 12px;
    }
    .category-editor select, .category-editor input {
      padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
      background: var(--panel-soft); color: var(--text);
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">Yours Mart Admin</div>
    <a class="nav-btn" href="/">Open Store</a>
  </header>

  <main>
    <section class="panel">
      <h2>Add New Product</h2>
      <form action="/admin/add" method="post">
        <div class="form-grid">
          <input type="text" name="name" placeholder="Product name" required />
          <input type="text" name="category" placeholder="Category" required />
          <input type="number" step="0.01" name="price" placeholder="Price" required />
          <input type="number" name="stock" placeholder="Stock" required />
          <button class="submit-btn" type="submit">Save Product</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <h2>Manage Categories</h2>
      <form action="/admin/update-category" method="post" class="category-editor">
        <select name="old_category" required>
          <option value="">Select category</option>
          {% for c in categories %}
          <option value="{{ c }}">{{ c }}</option>
          {% endfor %}
        </select>
        <input type="text" name="new_category" placeholder="New category name" required />
        <button class="submit-btn" type="submit">Rename Category</button>
      </form>
    </section>

    <section class="panel">
      <h2>Current Inventory</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Category</th>
              <th>Price</th>
              <th>Stock</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            {% for p in products %}
            <tr>
              <td>{{ p['id'] }}</td>
              <td>
                <form action="/admin/update/{{ p['id'] }}" method="post" class="inline-form">
                  <input type="text" name="name" value="{{ p['name'] }}" required />
                  <input type="text" name="category" value="{{ p['category'] }}" required />
                  <input type="number" step="0.01" name="price" value="{{ p['price'] }}" required />
                  <input type="number" name="stock" value="{{ p['stock'] }}" required />
                  <button class="update-btn" type="submit">Update</button>
                </form>
              </td>
              <td>{{ p['category'] }}</td>
              <td>Rs. {{ "{:,.0f}".format(p['price']) }}</td>
              <td>{{ p['stock'] }}</td>
              <td>
                <form action="/admin/delete/{{ p['id'] }}" method="post">
                  <button class="delete-btn" type="submit">Delete</button>
                </form>
              </td>
            </tr>
            {% else %}
            <tr>
              <td colspan="6">No products available.</td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
