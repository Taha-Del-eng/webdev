<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NavyMart | Profile</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --bg-deep: #e7edf7;
      --navy: #10213d;
      --panel: #ffffff;
      --line: #dfe7f5;
      --primary: #1d4ed8;
      --text: #122033;
      --muted: #62718d;
      --danger: #d93b3b;
      --success: #1a8f5f;
      --shadow: 0 18px 40px rgba(16, 33, 61, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(180deg, var(--bg), var(--bg-deep));
      color: var(--text); font-family: Arial, sans-serif; padding: 24px;
    }
    .form-box {
      width: min(520px, 100%); background: var(--panel); border: 1px solid var(--line);
      border-radius: 20px; padding: 32px; box-shadow: var(--shadow);
    }
    h1 { margin-top: 0; font-size: 2rem; color: var(--navy); }
    .sub { color: var(--muted); margin-bottom: 18px; }
    form { display: flex; flex-direction: column; gap: 14px; }
    input {
      width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line);
      background: #f8faff; color: var(--text);
    }
    button {
      background: var(--primary); color: white; border: none; padding: 14px 18px;
      border-radius: 10px; font-weight: 700; cursor: pointer;
    }
    .message {
      background: rgba(26, 143, 95, 0.08); border: 1px solid rgba(26, 143, 95, 0.25);
      color: #0f6e47; padding: 10px 12px; border-radius: 10px;
    }
    .error {
      background: rgba(217,59,59,0.08); border: 1px solid rgba(217,59,59,0.25);
      color: #9a1d1d; padding: 10px 12px; border-radius: 10px;
    }
    .link-row {
      margin-top: 16px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap;
      color: var(--muted);
    }
    a { color: var(--primary); text-decoration: none; }
  </style>
</head>
<body>
  <div class="form-box">
    <h1>My Profile</h1>
    <div class="sub">Edit your account details and password.</div>

    {% if success %}
      <div class="message">{{ success }}</div>
    {% endif %}
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/profile">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}" />
      <input type="text" name="full_name" value="{{ user['full_name'] }}" placeholder="Full name" maxlength="120" required />
      <input type="email" name="email" value="{{ user['email'] }}" placeholder="Email" maxlength="180" required />
      <input type="text" name="username" value="{{ user['username'] }}" placeholder="Username" maxlength="80" required />
      <input type="password" name="password" placeholder="New password (leave blank to keep current)" autocomplete="new-password" />
      <button type="submit">Update Profile</button>
    </form>

    <div class="link-row">
      <a href="/shop">Back to shop</a>
      <form method="post" action="/logout" style="display:inline"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><button type="submit">Logout</button></form>
    </div>
  </div>
</body>
</html>
