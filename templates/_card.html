<article class="product-card"><a href="/product/{{ p.slug }}" class="image-wrap"><img loading="lazy" src="{{ p.image_url }}" alt="{{ p.name }}"><span class="badge">{{ p.discount|round|int }}% OFF</span></a><div class="pc-body"><div class="muted">{{ p.brand }} · {{ p.category.split(' / ')[-1] }}</div><a class="pc-name" href="/product/{{ p.slug }}">{{ p.name }}</a><div class="rating">★ {{ p.rating }} <span>({{ p.review_count }})</span></div><div class="price">Rs. {{ "{:,.0f}".format(p.price) }} <del>Rs. {{ "{:,.0f}".format(p.original_price) }}</del></div><div class="pc-actions"><form method="post" action="/cart/add/{{ p.id }}"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><button class="btn small">Add to bag</button></form><form method="post" action="/wishlist/toggle/{{ p.id }}"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><button class="icon-btn">♡</button></form></div></div></article>
